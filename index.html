<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#193741" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>ZAGATOVKY — заготовки для дома и заведений</title>
    <meta
      name="description"
      content="Нарезанные, взвешенные и упакованные заготовки для готовки. Алматы, доставка в день нарезки."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Стили шрифтов подключаются не блокируя отрисовку: media="print" снимается
      после загрузки. Текст сразу рисуется системным шрифтом и подменяется
      фирменным (font-display: swap) — так первый экран появляется на треть
      секунды раньше. <noscript> оставляет обычное подключение без JS.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
